; Thai Gold Price LED Display — ESP32 + MAX7219 (32x8)
;
;   pio run -e esp32dev                 build firmware
;   pio run -e esp32dev -t upload       flash over USB-C
;   pio device monitor                  serial log (115200)
;   pio test -e native                  run unit tests on the PC (no hardware)
;   pio run -e esp32dev_ota -t upload   update over Wi-Fi (after the first USB flash)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 1.9 MB per app slot, still two slots for OTA updates
board_build.partitions = min_spiffs.csv
lib_deps =
    majicdesigns/MD_MAX72XX@3.5.1
    bblanchon/ArduinoJson@7.2.1
    tzapu/WiFiManager@2.0.17
build_flags =
    -Wall
test_ignore = *

; Wireless update. Device must be on the same network. Password must match
; OTA_PASSWORD in include/gold_config.h (edit --auth below if you change it).
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = gold-led.local
upload_flags =
    --auth=goldled-ota

[env:native]
platform = native
lib_deps =
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
